name: Build Dexin Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Dexin Mobile
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true

      - name: Add Android SDK tools
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.1"

      - name: Make Gradle executable
        run: |
          chmod +x gradlew

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Build Dexin Mobile APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK files
        if: success()
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Dexin Mobile APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DexinMobile-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
